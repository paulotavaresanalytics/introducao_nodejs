name: Testes das APIs
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run setup
      - run: npm run db:up
      - run: npm run test:all
      - if: failure()
        run: docker compose logs
      - if: always()
        run: npm run db:down
