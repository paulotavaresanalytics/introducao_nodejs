services:
  dev:
    image: node:24-bookworm
    volumes:
      - .:/workspaces/introducao_nodejs:cached
    command: sleep infinity
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: app_node
      DB_PASSWORD: local_dev_only
      DB_NAME: cadastro_usuarios
      MONGODB_URI: mongodb://mongo:27017/exemplo_nosql
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
